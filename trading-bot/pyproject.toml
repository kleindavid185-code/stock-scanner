[project]
name = "tradebot"
version = "0.1.0"
description = "Daily-bar strategy research, backtesting and Schwab execution bot"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "schwab-py>=1.5", "python-dotenv>=1.0", "yfinance>=0.2"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
